[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-migration-check"
version = "0.1.0"
description = "Preview trusted SQL migrations against a disposable SQLite backup"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pasmud" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9", "ruff>=0.15"]

[project.scripts]
sqlite-migration-check = "sqlite_migration_check.__main__:main"

[tool.setuptools]
packages = ["sqlite_migration_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM"]
